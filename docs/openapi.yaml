    post:
      operationId: requestOtp
      tags:
        - Auth
      summary: Send a login OTP to a phone number
      security: []
      description: >-
        Sends a 4-digit code by SMS to the given mobile number. This is step 1
        of the only login method — there is no password anywhere in the API;
        email is profile data, never a credential.


        The response is deliberately identical whether or not the number already
        has an account: the API will not confirm whether a phone is registered.
        An account is created on first successful verify.


        A resend cooldown applies on top of the route rate limiter, so calling
        this in a tight loop returns 429.
