        phone-OTP flow as everyone else**, and the role stored here decides
        which shell they land in.


        They show as `INVITED` until that first sign-in. Assign `storeId` for
        STAFF — without a boutique, every `/staff/*` call they make fails with
        `NO_STORE_ASSIGNED`.


        `permissions` is persisted verbatim for the UI’s toggles but is **not
        enforced**: authorization is role-based today.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                  minLength: 2
                  maxLength: 80
                phone:
                  type: string
                  pattern: ^[6-9]\d{9}$
                role:
                  type: string
                  enum:
                    - STAFF
                    - ADMIN
                storeId:
                  type: string
                  format: uuid
                permissions:
                  type: object
                  additionalProperties:
                    type: boolean
              required:
                - fullName
                - phone
                - role
      responses:
        "201":
          description: Account created.
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStaff"
        "401":
          description: Missing, malformed, or expired access token.
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: *a13
        "403":
          description: Authenticated, but not an ADMIN account.
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: *a22
        "409":
          description: That phone number already has an account.
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: CONFLICT
                  message: An account with this email or phone already exists
        "422":
          description: The request body failed validation. `details.fieldErrors` maps
            field → messages.
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
              example: *a8
        "500":
          description: Unexpected server error. Nothing is leaked; check logs by
            `x-request-id`.
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: *a3
  /api/v1/admin/catalog:
    get:
      operationId: listAdminCatalog
      tags:
        - Admin
      summary: List the catalogue
      security: *a25
      description: The admin view of every product — **including inactive ones**,
        which the public `GET /products` hides — with total stock across all
        locations. `q` searches name and brand.
      parameters:
        - schema:
            type: string
            description: Search name or brand.
            example: poplin
          required: false
          name: q
          in: query
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            description: 1-based page number.
            example: 1
          required: false
          name: page
          in: query
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            description: Rows per page.
            example: 20
          required: false
          name: limit
          in: query
      responses:
        "200":
          description: A page of catalogue rows.
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAdminCatalog"
        "401":
          description: Missing, malformed, or expired access token.
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: *a13
        "403":
          description: Authenticated, but not an ADMIN account.
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: *a22
        "422":
          description: The request body failed validation. `details.fieldErrors` maps
            field → messages.
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
              example: *a8
        "500":
          description: Unexpected server error. Nothing is leaked; check logs by
