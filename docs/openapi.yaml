openapi: 3.0.3
info:
  title: Fabrashion API
  version: 0.1.0
  description: >-
    Backend for **Fabrashion**, a premium clothing store: catalogue, cart,
    orders, and at-home trials.

    This spec is generated from the Zod schemas the server validates against, so
    it always matches the running code.


    ## Authentication

    Everything except `/health` and the auth entry points expects a bearer
    token:


    1. `POST /api/v1/auth/otp/request` with a phone number, then `POST
    /api/v1/auth/otp/verify` with the code → returns `{ user, accessToken,
    refreshToken }`. Phone-OTP is the only login method; first verify creates
    the account.

    2. Send `Authorization: Bearer <accessToken>` on subsequent calls.

    3. The access token lasts **15 minutes**. On a 401, call `POST
    /api/v1/auth/refresh` with your refresh token and retry.


    Refresh tokens are **single-use and rotated**: each refresh returns a new
    one and kills the old. Persist the new pair every time, and never run two
    refreshes concurrently — replaying a rotated token is read as theft and
    signs the user out of every device.


    ## Errors

    Every failure uses one envelope — see the `Error` schema:


    ```json

    { "error": { "code": "UNAUTHORIZED", "message": "Invalid email or password"
    } }

    ```


    Branch on `error.code` (stable), never on `message` (copy, may change). A
    422 adds `details.fieldErrors`, mapping each rejected field to its messages
    — render those inline on the form.


    ## Conventions

    - **Money** is always an integer count of **paise** (₹1 = 100 paise), in
    fields suffixed `Paise`. Never floats.

    - **Timestamps** are UTC ISO-8601 strings.

    - **Ids** are UUIDs.

    - **Phone numbers** are submitted as 10 digits and stored E.164
    (`+91XXXXXXXXXX`).

    - Every response carries an **`x-request-id`**; send your own to correlate,
    and quote it in bug reports.


    ## Rate limits

    The `/auth/*` endpoints allow **30 requests per 15 minutes per IP**. Over
    that you get a 429 with `Retry-After`.
  contact:
    name: Fabrashion Engineering
servers:
  - url: http://localhost:4000
    description: Local development
tags:
  - name: Auth
    description: Phone-OTP sign-in, token rotation, and the current user.
  - name: Catalog
    description: Categories, products, and live stock. Public — no token needed.
  - name: Cart
    description: The signed-in user’s cart. Server-authoritative pricing.
  - name: Addresses
    description: Saved shipping addresses.
  - name: Orders
    description: Checkout and the customer’s own orders.
  - name: Trials
    description: "At-home trials: eligibility, booking, and the keep/return flow."
  - name: Staff
    description: Store-ops back office — inventory and the fulfilment board. **STAFF
      or ADMIN only**, and always scoped to the caller’s own boutique.
  - name: Admin
    description: Business back office — KPIs, team, catalogue, and all orders.
      **ADMIN only**.
  - name: System
    description: Probes and service metadata. No authentication required.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Short-lived (15 min) access token from `POST /auth/otp/verify`,
        sent as `Authorization: Bearer <accessToken>`. When it expires the API
        returns 401 UNAUTHORIZED — exchange the refresh token at `POST
        /auth/refresh` for a new pair."
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - BAD_REQUEST
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - VALIDATION_ERROR
                - TOO_MANY_REQUESTS
                - INTERNAL_ERROR
                - INSUFFICIENT_STOCK
                - ILLEGAL_TRANSITION
                - NO_STORE_ASSIGNED
                - PAYMENT_PENDING
                - NOT_SERVICEABLE
              description: Stable, machine-readable code. Branch on this, never on `message`.
              example: UNAUTHORIZED
            message:
              type: string
              description: Human-readable explanation. Safe to surface to the user.
              example: Invalid email or password
            details:
              type: object
              description: Optional, code-specific context. See `ValidationError` for the 422
                shape.
          required:
            - code
            - message
      required:
        - error
      description: Every non-2xx response from this API uses this envelope.
    ValidationError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
            message:
              type: string
              example: Validation failed
            details:
              type: object
              properties:
                formErrors:
                  type: array
                  items:
                    type: string
                  description: Errors not attributable to a single field.
                  example: []
                fieldErrors:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
                  description: Field name → list of messages. Render these next to the input.
                  example:
                    email:
                      - Enter a valid email
                    password:
                      - Password must be at least 8 characters
              required:
                - formErrors
                - fieldErrors
          required:
            - code
            - message
            - details
      required:
        - error
      description: Request body failed schema validation.
    AddressSnapshot:
      type: object
      properties:
        line1:
          type: string
          example: 221B, 4th Cross, Indiranagar
        line2:
          type: string
          nullable: true
          example: Near Metro Station
        city:
          type: string
          example: Bengaluru
        state:
          type: string
          example: Karnataka
        pincode:
          type: string
          example: "560038"
        geoLat:
          type: number
          nullable: true
          description: Set once the address is geocoded.
          example: 12.9716
        geoLng:
          type: number
          nullable: true
          example: 77.5946
      required:
        - line1
        - line2
        - city
        - state
        - pincode
        - geoLat
        - geoLng
      description: Where it was delivered, as recorded at the time. Deliberately has
        no `id` — it is a copy, not a live link to the user’s address book.
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
          description: "`ok` only when every dependency is up; otherwise `degraded`."
          example: ok
        uptime:
          type: number
          description: Seconds since the process started.
          example: 1284.51
        timestamp:
          type: string
          format: date-time
          example: 2026-07-14T09:12:04.512Z
        services:
          type: object
          properties:
            db:
              type: string
              enum: &a1
                - up
                - down
              example: up
            redis:
              type: string
              enum: *a1
              example: up
          required:
            - db
            - redis
          description: Per-dependency reachability, each checked with a 2s timeout.
      required:
        - status
        - uptime
        - timestamp
        - services
      description: Liveness/readiness snapshot.
    ApiRoot:
      type: object
      properties:
        name:
          type: string
          example: fabrashion-backend
        version:
          type: string
          example: v1
        status:
          type: string
          example: ok
      required:
        - name
        - version
        - status
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: b1d1f0a4-4c9e-4b9a-9c1e-2f3a4b5c6d7e
        fullName:
          type: string
          example: Aarav Sharma
        email:
          type: string
          nullable: true
          format: email
          description: Null for phone-only accounts (Phase 1b).
          example: aarav.sharma@example.com
        phone:
          type: string
          nullable: true
          description: E.164, always +91-prefixed. Null for email-only accounts.
          example: "+919876543210"
        role:
          type: string
          enum:
            - CUSTOMER
            - STAFF
            - ADMIN
          description: Authorisation role. Customers may only touch their own resources.
          example: CUSTOMER
      required:
        - id
        - fullName
        - email
        - phone
        - role
      description: The authenticated user. Never contains credentials.
    TokenPair:
      type: object
      properties:
        accessToken:
          type: string
          description: "JWT, valid 15 minutes. Send as `Authorization: Bearer
            <accessToken>`."
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJiMWQxZjBhNC00YzllLTRiOWEtOWMxZS0yZjNhNGI1YzZkN2UiLCJyb2xlIjoiQ1VTVE9NRVIiLCJpYXQiOjE3NTIzOTA0MDAsImV4cCI6MTc1MjM5MTMwMH0.9x2QpQ0rQ6m2mVQ0F6bqK3nqfQ0X1yQ0m8rQ0y9kQ2s
        refreshToken:
          type: string
          description: "Opaque token, valid 30 days, single-use: every refresh rotates it.
            Store it in secure storage (Keychain / Keystore), never in plain
            AsyncStorage — and replace it with the one each refresh returns."
          example: 3f6d1c9a5b8e4d2f7a0c1e9b4d6f8a2c5e7b9d1f3a5c7e9b1d3f5a7c9e1b3d5f
      required:
        - accessToken
        - refreshToken
      description: A freshly issued access + refresh token pair.
    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        accessToken:
          type: string
          description: "JWT, valid 15 minutes. Send as `Authorization: Bearer
            <accessToken>`."
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJiMWQxZjBhNC00YzllLTRiOWEtOWMxZS0yZjNhNGI1YzZkN2UiLCJyb2xlIjoiQ1VTVE9NRVIiLCJpYXQiOjE3NTIzOTA0MDAsImV4cCI6MTc1MjM5MTMwMH0.9x2QpQ0rQ6m2mVQ0F6bqK3nqfQ0X1yQ0m8rQ0y9kQ2s
        refreshToken:
          type: string
          description: "Opaque token, valid 30 days, single-use: every refresh rotates it.
            Store it in secure storage (Keychain / Keystore), never in plain
            AsyncStorage — and replace it with the one each refresh returns."
          example: 3f6d1c9a5b8e4d2f7a0c1e9b4d6f8a2c5e7b9d1f3a5c7e9b1d3f5a7c9e1b3d5f
      required:
        - user
        - accessToken
        - refreshToken
      description: The signed-in user plus a new token pair.
    OtpRequestResponse:
      type: object
      properties:
        expiresInSec:
          type: integer
          description: Seconds until the code expires. Drives the resend countdown in the
            app.
          example: 300
        devCode:
          type: string
          description: The OTP itself, so the flow is walkable without an SMS provider.
            Only present when `OTP_EXPOSE_CODE` is on and `NODE_ENV` is not
            production — never in production.
          example: "1234"
      required:
        - expiresInSec
      description: Confirmation that an OTP was sent. Never contains the user.
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 9f1c2d3e-4a5b-6c7d-8e9f-0a1b2c3d4e5f
        name:
          type: string
          example: Women
        slug:
          type: string
          example: women
        parentId:
          type: string
          nullable: true
          format: uuid
          description: Null for a top-level category. Filtering by a parent includes its
            children.
          example: null
      required:
        - id
        - name
        - slug
        - parentId
      description: A node in the (two-level) category tree.
    ProductImage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          example: https://cdn.fabrashion.in/p/poplin-top-1.jpg
        altText:
          type: string
          nullable: true
          example: Cotton poplin top, ivory
        position:
          type: integer
          description: Sort order; 0 is the hero image.
          example: 0
      required:
        - id
        - url
        - altText
        - position
    ProductVariant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
          example: FB-CPT-IVR-M
        size:
          type: string
          example: M
        colorName:
          type: string
          example: Ivory
        colorHex:
          type: string
          nullable: true
          example: "#F3EFE7"
        pricePaise:
          type: integer
          description: Selling price, GST-inclusive, in paise (₹1,299 → `129900`).
          example: 129900
        mrpPaise:
          type: integer
          description: List price. `mrpPaise > pricePaise` means it is on discount.
          example: 159900
        availableQty:
          type: integer
          description: Sellable **right now**, summed across online locations only (every
            warehouse, plus stores with `syncEnabled`). `0` means out of stock —
            do not let the user add it to the cart.
          example: 7
      required:
        - id
        - sku
        - size
        - colorName
        - colorHex
        - pricePaise
        - mrpPaise
        - availableQty
      description: A buyable size + colour of a product. Carts and orders reference
        this, never the product.
    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Cotton Poplin Top
        slug:
          type: string
          example: cotton-poplin-top
        description:
          type: string
        brand:
          type: string
          nullable: true
          example: Fabrashion
        department:
          type: string
          enum:
            - MEN
            - WOMEN
            - UNISEX
            - KIDS
          example: WOMEN
        trialEligible:
          type: boolean
          description: Whether this product can be booked for an at-home trial (`POST
            /trials`).
          example: true
        images:
          type: array
          items:
            $ref: "#/components/schemas/ProductImage"
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ProductVariant"
      required:
        - id
        - name
        - slug
        - description
        - brand
        - department
        - trialEligible
        - images
        - variants
      description: A catalogue product with its images and buyable variants.
    PaginatedProducts:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        meta:
          type: object
          properties:
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 20
            total:
              type: integer
              description: Total matching rows.
              example: 42
            totalPages:
              type: integer
              description: At least 1, even when empty.
              example: 3
          required:
            - page
            - limit
            - total
            - totalPages
          description: Pagination cursor for the enclosing list.
      required:
        - data
        - meta
      description: Paginated list. Read `meta.totalPages` to know when to stop.
    Availability:
      type: object
      properties:
        productId:
          type: string
          format: uuid
        variants:
          type: array
          items:
            type: object
            properties:
              variantId:
                type: string
                format: uuid
              availableQty:
                type: integer
                example: 7
              inStock:
                type: boolean
                description: Convenience for `availableQty > 0`.
                example: true
            required:
              - variantId
              - availableQty
              - inStock
        stores:
          type: array
          items:
            type: object
            properties:
              storeId:
                type: string
                format: uuid
              name:
                type: string
                example: Fabrashion Indiranagar
              city:
                type: string
                example: Bengaluru
              inStock:
                type: boolean
                description: True if the store has any variant in stock.
                example: true
            required:
              - storeId
              - name
              - city
              - inStock
          description: Sync-enabled stores carrying this product. Powers the "available
            at" strip on the PDP.
      required:
        - productId
        - variants
        - stores
      description: Live stock for one product, per variant and per store.
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-4a5b-8c9d-0e1f2a3b4c5d
        label:
          type: string
          enum:
            - HOME
            - WORK
            - OTHER
          description: Shown as a chip in the app. Purely cosmetic.
          example: HOME
        recipientName:
          type: string
          example: Aarav Sharma
        recipientPhone:
          type: string
          description: Who the courier calls — may differ from the account phone.
          example: "+919876543210"
        line1:
          type: string
          example: 221B, 4th Cross, Indiranagar
        line2:
          type: string
          nullable: true
          example: Near Metro Station
        city:
          type: string
          example: Bengaluru
        state:
          type: string
          example: Karnataka
        pincode:
          type: string
          description: Six digits. Determines trial serviceability (`GET
            /trials/eligibility`).
          example: "560038"
        isDefault:
          type: boolean
          description: Exactly one address is default; setting a new one clears the
            previous.
          example: true
      required:
        - id
        - label
        - recipientName
        - recipientPhone
        - line1
        - line2
        - city
        - state
        - pincode
        - isDefault
      description: A saved shipping address belonging to the signed-in user.
    AddressList:
      type: object
      properties:
        addresses:
          type: array
          items:
            $ref: "#/components/schemas/Address"
      required:
        - addresses
      description: The user’s remaining addresses after a delete.
    CartLine:
      type: object
      properties:
        itemId:
          type: string
          format: uuid
          description: Pass this to PATCH/DELETE.
        productId:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        name:
          type: string
          example: Cotton Poplin Top
        brand:
          type: string
          nullable: true
          example: Fabrashion
        size:
          type: string
          example: M
        colorName:
          type: string
          example: Ivory
        colorHex:
          type: string
          nullable: true
          example: "#F3EFE7"
        imageUrl:
          type: string
          nullable: true
          description: The product’s hero image.
        pricePaise:
          type: integer
          description: Unit price, GST-inclusive.
          example: 129900
        mrpPaise:
          type: integer
          example: 159900
        qty:
          type: integer
          example: 2
        availableQty:
          type: integer
          description: Live stock for this variant. If it drops below `qty`, show the line
            as over-committed — checkout will reject it.
          example: 7
        lineTotalPaise:
          type: integer
          description: "`pricePaise × qty`."
          example: 259800
      required:
        - itemId
        - productId
        - variantId
        - name
        - brand
        - size
        - colorName
        - colorHex
        - imageUrl
        - pricePaise
        - mrpPaise
        - qty
        - availableQty
        - lineTotalPaise
      description: One line of the cart, denormalised so the cart renders without
        extra fetches.
    CartTotals:
      type: object
      properties:
        count:
          type: integer
          description: Total units (sum of `qty`), for the tab badge.
          example: 3
        subtotalPaise:
          type: integer
          description: GST-inclusive sum of the lines.
          example: 259800
        discountPaise:
          type: integer
          description: MRP − subtotal. `0` when nothing is discounted.
          example: 60000
        taxPaise:
          type: integer
          description: GST **broken out of** the inclusive subtotal — it is not added on
            top. Display only.
          example: 27834
        shippingPaise:
          type: integer
          description: Flat rate, waived above the free-shipping threshold (and on an
            empty cart).
          example: 0
        totalPaise:
          type: integer
          description: "`subtotalPaise + shippingPaise`. What the user pays."
          example: 259800
      required:
        - count
        - subtotalPaise
        - discountPaise
        - taxPaise
        - shippingPaise
        - totalPaise
      description: Server-computed money. **Never recompute these client-side** — the
        server is authoritative, and checkout re-prices from scratch.
    Cart:
      type: object
      properties:
        id:
          type: string
          format: uuid
        lines:
          type: array
          items:
            $ref: "#/components/schemas/CartLine"
        totals:
          $ref: "#/components/schemas/CartTotals"
      required:
        - id
        - lines
        - totals
      description: The signed-in user’s cart. Every mutation returns the whole cart back.
    OrderItem:
      type: object
      properties:
        productId:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        name:
          type: string
          example: Cotton Poplin Top
        brand:
          type: string
          nullable: true
          example: Fabrashion
        size:
          type: string
          example: M
        colorName:
          type: string
          example: Ivory
        colorHex:
          type: string
          nullable: true
          example: "#F3EFE7"
        imageUrl:
          type: string
          nullable: true
        quantity:
          type: integer
          example: 2
        unitPricePaise:
          type: integer
          description: Price **as charged**, frozen at purchase. Later price changes never
            rewrite it.
          example: 129900
        lineTotalPaise:
          type: integer
          example: 259800
      required:
        - productId
        - variantId
        - name
        - brand
        - size
        - colorName
        - colorHex
        - imageUrl
        - quantity
        - unitPricePaise
        - lineTotalPaise
      description: A purchased line. Snapshotted, so it survives the product being
        edited or delisted.
    OrderPayment:
      type: object
      nullable: true
      properties:
        status:
          type: string
          description: e.g. `CREATED`, `CAPTURED`, `FAILED`.
          example: CAPTURED
        provider:
          type: string
          example: PHONEPE
        amountPaise:
          type: integer
          example: 259800
        method:
          type: string
          nullable: true
          description: UPI / card / …, once known.
          example: UPI
      required:
        - status
        - provider
        - amountPaise
        - method
      description: The payment attached to the order. **Null until one is created.**
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - PENDING
            - PAID
            - FULFILLING
            - SHIPPED
            - DELIVERED
            - CANCELLED
            - REFUNDED
          description: Lifecycle. A fresh checkout is `PENDING` (reserved, not yet paid);
            capture moves it to `PAID`, which is when staff see it on the
            fulfilment board.
          example: PAID
        source:
          type: string
          enum:
            - ONLINE
            - TRIAL_CONVERSION
          description: "`ONLINE` for an app checkout; `TRIAL_CONVERSION` for the order
            raised automatically from the pieces kept after an at-home trial."
          example: ONLINE
        subtotalPaise:
          type: integer
          example: 259800
        taxPaise:
          type: integer
          description: GST broken out of the inclusive subtotal.
          example: 27834
        shippingPaise:
          type: integer
          example: 0
        totalPaise:
          type: integer
          description: What was actually charged.
          example: 259800
        itemCount:
          type: integer
          description: Total units across the lines.
          example: 2
        shippingAddress:
          allOf:
            - $ref: "#/components/schemas/AddressSnapshot"
            - description: An **immutable snapshot** of the address at purchase time — not a
                reference. Editing or deleting the saved address never changes a
                placed order.
        placedAt:
          type: string
          nullable: true
          format: date-time
          description: When payment was captured. Null while still `PENDING`.
          example: 2026-07-14T09:12:04.512Z
        createdAt:
          type: string
          format: date-time
          example: 2026-07-14T09:10:41.002Z
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        payment:
          $ref: "#/components/schemas/OrderPayment"
      required:
        - id
        - status
        - source
        - subtotalPaise
        - taxPaise
        - shippingPaise
        - totalPaise
        - itemCount
        - shippingAddress
        - placedAt
        - createdAt
        - items
        - payment
      description: A customer order.
    PaginatedOrders:
      type: object
      properties:
        data:
          type: array
          items:
