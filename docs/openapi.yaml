    Trial:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - REQUESTED
            - CONFIRMED
            - OUT_FOR_TRIAL
            - IN_TRIAL
            - COMPLETED
            - CANCELLED
          description: >-
            Lifecycle: `REQUESTED` (booked; the charge is not captured yet) →
            `CONFIRMED` (paid, and the boutique accepted it) → `OUT_FOR_TRIAL`
            (dispatched) → `IN_TRIAL` (delivered; the keep/return window is
            open) → `COMPLETED` (outcomes recorded).


            A conversion is **not** a separate status: a completed trial where
            something was kept simply carries a non-null `conversionOrderId`.
            `CANCELLED` is reachable only from `REQUESTED` or `CONFIRMED` — once
            the pieces are out, resolve it through `/outcome`.
          example: IN_TRIAL
        store:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
              example: Fabrashion Indiranagar
            code:
              type: string
              example: BLR01
          required:
            - id
            - name
            - code
          description: The boutique fulfilling the trial.
        address:
          allOf:
            - $ref: "#/components/schemas/AddressSnapshot"
            - description: Where the pieces are delivered — snapshotted at booking time.
        note:
          type: string
          nullable: true
          description: Free-text note for the stylist.
          example: Please ring the bell twice.
        slotStart:
          type: string
          format: date-time
          example: 2026-07-16T05:30:00.000Z
        slotEnd:
          type: string
          format: date-time
          example: 2026-07-16T07:30:00.000Z
        authAmountPaise:
          type: integer
          description: The amount authorised on the card to cover the pieces. Returned in
            full for anything sent back — you are only finally charged for what
            you keep.
          example: 259800
        paid:
          type: boolean
          description: Whether the trial charge has been captured. Staff can only confirm
            a paid booking.
          example: true
        refundPaise:
          type: integer
          description: Refunded so far, for returned pieces.
          example: 129900
        trialEndsAt:
          type: string
          nullable: true
          format: date-time
          description: Deadline for the keep/return decision, set once the pieces are
            delivered. Anything still `PENDING` at this point is auto-returned.
          example: 2026-07-17T07:30:00.000Z
        conversionOrderId:
          type: string
          nullable: true
          format: uuid
          description: The order raised for the KEPT pieces, once outcomes are recorded.
            Null if nothing was kept. It is created already `PAID` — the trial
            charge covered it.
        itemCount:
          type: integer
          example: 2
        items:
          type: array
          items:
            $ref: "#/components/schemas/TrialItem"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - status
        - store
        - address
        - note
        - slotStart
        - slotEnd
        - authAmountPaise
        - paid
        - refundPaise
        - trialEndsAt
