  /api/v1/checkout:
    post:
      operationId: checkout
      tags:
        - Orders
      summary: Place the cart as an order
      security: &a19
        - bearerAuth: []
      description: >-
        Turns the active cart into a `PENDING` order shipped to one of your
        saved addresses, and **reserves the stock** for it.


        Money is re-priced from the database here — whatever totals the client
        was showing are ignored, so a stale cart cannot underpay. The cart is
        emptied on success.


        The order is not a sale yet: it stays `PENDING` until the payment is
        captured (today via `POST /orders/{id}/confirm-dev`; PhonePe in phase
        4c). If a line no longer has stock, the whole checkout fails with 409
        `INSUFFICIENT_STOCK` and nothing is reserved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                addressId:
                  type: string
                  format: uuid
              required:
                - addressId
      responses:
        "201":
          description: Order placed (`PENDING`) and stock reserved.
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          description: Missing, malformed, or expired access token.
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: *a13
        "404":
          description: No such address on your account.
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
