  /api/v1/staff/inventory/{variantId}:
    patch:
      operationId: adjustStaffInventory
      tags:
        - Staff
      summary: Adjust stock buckets
      security: *a21
      description: >-
        Moves stock between buckets at the caller’s boutique. Send **deltas, not
        absolute values** (`floor: -1` means "one fewer on the floor") — that is
        what lets the mobile app queue adjustments offline and replay them in
        any order once it reconnects.


        **Idempotent by `eventId`:** replaying the same `eventId` returns the
        current row without applying the delta twice, so the offline queue can
        retry safely. Generate a fresh UUID per user action, not per request
        attempt.


        Negativity is guarded atomically inside the transaction: an adjustment
        that would take any bucket below zero is rejected with 409
        `INSUFFICIENT_STOCK` and nothing is written.
      parameters:
        - schema:
            type: string
            format: uuid
            description: The variant whose stock is moving.
          required: true
          name: variantId
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deltas:
                  type: object
                  properties:
                    floor:
                      type: integer
                      nullable: true
                      minimum: -99
                      maximum: 99
                    counter:
                      type: integer
                      nullable: true
                      minimum: -99
                      maximum: 99
                    reserved:
                      type: integer
                      nullable: true
                      minimum: -99
                      maximum: 99
                eventId:
                  type: string
                  format: uuid
              required:
                - deltas
                - eventId
      responses:
        "200":
          description: The updated row (or the unchanged row, on an idempotent replay).
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffInventoryRow"
        "401":
          description: Missing, malformed, or expired access token.
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: *a13
        "403":
          description: Authenticated, but your role may not perform this action.
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: *a22
        "404":
          description: That variant is not stocked at your boutique.
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: *a12
        "409":
          description: The delta would take a bucket below zero, or no boutique is assigned.
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: INSUFFICIENT_STOCK
                  message: That change would take stock below zero
        "422":
          description: The request body failed validation. `details.fieldErrors` maps
            field → messages.
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
              example: *a8
        "500":
          description: Unexpected server error. Nothing is leaked; check logs by
            `x-request-id`.
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: *a3
