      tags:
        - Trials
      summary: Keep or return each piece
      security: *a20
      description: >-
        Records the decision for the trial. **Every item must be resolved in one
        call** — send a `KEPT` or `RETURNED` verdict for each `trialItemId`; a
        partial list is rejected.


        Kept pieces are rolled into a **conversion order** (its id comes back as
        `conversionOrderId`) and the held stock is consumed. Returned pieces are
        refunded and the stock goes back to the boutique.


        Only valid while the trial is `IN_TRIAL` and before `trialEndsAt`; after
        the deadline the sweep has already auto-returned everything, and this
        fails with 409 `ILLEGAL_TRANSITION`.
      parameters:
        - schema:
            type: string
            format: uuid
            description: Trial booking id.
            example: 3f5a7c9e-1b3d-45f7-a9c1-e3b5d7f9a1c3
          required: true
          name: id
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      trialItemId:
                        type: string
                        format: uuid
                      outcome:
                        type: string
                        enum:
                          - KEPT
                          - RETURNED
                    required:
                      - trialItemId
                      - outcome
                  minItems: 1
                  maxItems: 10
              required:
                - items
