  parameters: {}
paths:
  /health:
    get:
      operationId: getHealth
      tags:
        - System
      summary: Liveness / readiness probe
      security: []
      description: >-
        Reports the reachability of Postgres and Redis.


        Deliberately returns **200 even when a dependency is down** — the body
        says `degraded` and names the offender. Probes should therefore assert
        on `status`, not merely on the HTTP code. Unauthenticated, unversioned,
        and safe to poll.
      responses:
        "200":
          description: Always returned, whether healthy or degraded.
          headers: &a2
            x-request-id: &a4
              description: Correlation id for this request — taken from the inbound
                `x-request-id` if you send one, otherwise generated. Appears on
