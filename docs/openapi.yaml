      summary: Rotate the token pair
      security: []
      description: >-
        Trades a valid refresh token for a brand-new access + refresh pair. Call
        this when a request fails with 401 because the 15-minute access token
        expired, then retry the original request.


        **Rotation is mandatory:** the token you send is revoked immediately, so
        you must persist the pair this endpoint returns. Replaying an
        already-rotated token is treated as theft — the entire token family for
        that user is revoked and every session is signed out. Serialise your
        refresh calls (one in flight at a time) so two concurrent 401s do not
        trigger this.
