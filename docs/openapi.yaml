        "200":
          description: A new pair. The refresh token you sent is now dead — store these
            instead.
          headers: *a7
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJiMWQxZjBhNC00YzllLTRiOWEtOWMxZS0yZjNhNGI1YzZkN2UiLCJyb2xlIjoiQ1VTVE9NRVIiLCJpYXQiOjE3NTIzOTA0MDAsImV4cCI6MTc1MjM5MTMwMH0.9x2QpQ0rQ6m2mVQ0F6bqK3nqfQ0X1yQ0m8rQ0y9kQ2s
                refreshToken: 3f6d1c9a5b8e4d2f7a0c1e9b4d6f8a2c5e7b9d1f3a5c7e9b1d3f5a7c9e1b3d5f
        "401":
          description: The refresh token is unknown, expired, or already rotated (family
            revoked).
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
