          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: *a3
  /api/v1/admin/products:
    post:
      operationId: createAdminProduct
      tags:
        - Admin
      summary: Create a product
      security: *a25
      description: >-
        The catalogue write path — creates a product with all its variants in
        one call, and opens stock for each of them at the main warehouse
        (`initialWarehouseQty`).


        The slug is derived from the name and de-duplicated server-side. Every
        size + colour pair must be unique. Images are a **hosted URL** for now;
        S3 presigned uploads land in a later phase.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 120
                description:
                  type: string
                  minLength: 1
                  maxLength: 2000
                categoryId:
                  type: string
                  format: uuid
                department:
                  type: string
                  enum:
                    - MEN
                    - WOMEN
                    - UNISEX
                    - KIDS
                brand:
                  type: string
                  minLength: 1
                  maxLength: 60
                fit:
                  type: string
                  minLength: 1
                  maxLength: 40
                material:
                  type: string
                  minLength: 1
                  maxLength: 80
                gstRatePct:
                  type: integer
                  minimum: 0
                  maximum: 28
                  default: 12
                hsnCode:
                  type: string
                  minLength: 2
                  maxLength: 10
                trialEligible:
                  type: boolean
                  default: false
                imageUrl:
                  type: string
                  format: uri
                initialWarehouseQty:
                  type: integer
                  minimum: 0
                  maximum: 10000
                  default: 0
                variants:
                  type: array
                  items:
                    type: object
                    properties:
                      size:
                        type: string
                        minLength: 1
                        maxLength: 12
                      colorName:
                        type: string
                        minLength: 1
                        maxLength: 40
                      colorHex:
                        type: string
                        pattern: ^#[0-9a-fA-F]{6}$
                      pricePaise:
                        type: integer
                        minimum: 0
                        exclusiveMinimum: true
                      mrpPaise:
                        type: integer
                        minimum: 0
                        exclusiveMinimum: true
                    required:
                      - size
                      - colorName
                      - pricePaise
                      - mrpPaise
                  minItems: 1
                  maxItems: 60
              required:
                - name
                - description
                - categoryId
                - department
                - variants
      responses:
        "201":
          description: Product created, with stock opened at the warehouse.
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCatalogRow"
        "401":
          description: Missing, malformed, or expired access token.
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: *a13
        "403":
          description: Authenticated, but not an ADMIN account.
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: *a22
        "404":
          description: No such category.
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: *a12
        "422":
          description: The request body failed validation. `details.fieldErrors` maps
            field → messages.
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
              example: *a8
        "500":
          description: Unexpected server error. Nothing is leaked; check logs by
            `x-request-id`.
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: *a3
  /api/v1/admin/orders:
    get:
      operationId: listAdminOrders
      tags:
        - Admin
      summary: List all orders
      security: *a25
      description: Every order across the business, newest first, filterable by design
        status. **`PENDING` orders are never returned** — an unpaid order is not
        a sale, so it would distort the table and the KPIs alike.
      parameters:
        - schema:
            type: string
            enum: *a26
            description: Filter by design status.
            example: NEW
          required: false
          name: status
          in: query
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            description: 1-based page number.
            example: 1
          required: false
          name: page
          in: query
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            description: Rows per page.
            example: 20
          required: false
          name: limit
          in: query
      responses:
